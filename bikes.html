<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our bikes | Bikzooom</title>
<meta name="description" content="Browse all bikes available for rent, with hourly and daily prices.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="bikes">
<div id="site-header"></div>
<main class="wrap page">
  <div class="page-head"><h1>Our bikes</h1><p>Prices shown per hour and per day. Pick one to see the full price for your dates.</p></div>
  <div class="toolbar">
    <div class="chips-row" id="filters" role="group" aria-label="Filter by type"></div>
    <div class="tool-right">
      <label class="sr" for="q">Search bikes</label><input id="q" type="search" placeholder="Search by name or brand">
      <label class="sr" for="sort">Sort</label>
      <select id="sort"><option value="recommended">Recommended</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
    </div>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid-bikes" id="grid"><p class="empty">Loading bikes...</p></div>
</main>
<div id="site-footer"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script>
<script src="js/card.js"></script><script src="js/bikes.js"></script>
</body></html>
