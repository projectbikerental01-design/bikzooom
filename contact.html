<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Bikzooom</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<div id="site-header"></div>
<main class="wrap page">
  <div class="page-head"><h1>Contact us</h1><p>Questions about a bike, a booking or delivery? Reach us any way below.</p></div>
  <div class="two">
    <div>
      <ul class="contact-list" id="clist"></ul>
      <div class="map" id="map"></div>
    </div>
    <form id="mf" class="form-box" novalidate>
      <h2>Send us a message</h2>
      <div class="field"><label for="m-name">Your name</label><input id="m-name" maxlength="80" required></div>
      <div class="field"><label for="m-email">Email</label><input id="m-email" type="email" maxlength="100" required></div>
      <div class="field"><label for="m-phone">Phone (optional)</label><input id="m-phone" inputmode="numeric" maxlength="14"></div>
      <div class="field"><label for="m-msg">Message</label><textarea id="m-msg" rows="5" maxlength="1000" required></textarea></div>
      <button class="btn btn-green" type="submit" id="m-btn">Send message</button>
    </form>
  </div>
  <h2 class="mt">Common questions</h2>
  <div class="faq" id="faq"></div>
</main>
<div id="site-footer"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script>
<script src="js/contact.js"></script>
</body></html>
