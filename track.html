<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track your booking | Bikzooom</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="track">
<div id="site-header"></div>
<main class="wrap page narrow">
  <div class="page-head"><h1>Track your booking</h1><p>Enter the booking code you received after submitting the form. It looks like BZ-ABCDE-FGHJK.</p></div>
  <form id="tf" class="inline-form" autocomplete="off">
    <label class="sr" for="code">Booking code</label>
    <input id="code" placeholder="BZ-XXXXX-XXXXX" maxlength="14" required>
    <button class="btn btn-green" type="submit">Check status</button>
  </form>
  <div id="result" aria-live="polite"></div>
  <div id="recent"></div>
</main>
<div id="site-footer"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script>
<script src="js/track.js"></script>
</body></html>
